name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  ci:
    name: Typecheck & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # --- Reliable gate: these must pass for CI to be green ---
      - name: CLI typecheck
        run: pnpm -C cli run typecheck

      - name: CLI offline unit tests
        run: pnpm -C cli run test:unit

      # `next lint` was removed in Next 16 and the repo has no ESLint config —
      # the old "Web lint" step failed on every push since 0.3.12. A real
      # build is the meaningful gate for the landing page.
      - name: Web build
        run: pnpm run build

  # The smoke test (cli test:smoke) hits the live gaokao.cn API and can flake
  # on upstream outages, so it is kept out of the blocking gate above.
  # It runs in a separate, non-blocking job for visibility only.
  smoke:
    name: CLI smoke (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: CLI network smoke test
        run: pnpm -C cli run test:smoke

  # Tag-driven publish: `git tag v0.3.17 && git push --tags`.
  # This is the ONLY sanctioned npm publish path — a local `npm publish` from a
  # later-deleted worktree caused the 0.3.12 source-loss incident (gitHead
  # unreachable from any branch). Requires NPM_TOKEN in repo secrets.
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Version must match tag
        working-directory: cli
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF#refs/tags/v}"
          if [ "$PKG" != "$TAG" ]; then
            echo "package.json version $PKG != tag $TAG"; exit 1
          fi

      - name: Publish
        working-directory: cli
        run: pnpm publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
